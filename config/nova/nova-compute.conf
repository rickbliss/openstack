[pci]
# Quadro P2200 - pre-bound to VFIO, regular PCI passthrough
alias = {"device_type": "type-PCI", "name": "quadro_p2200", "product_id": "1c31", "vendor_id": "10de"}

# Tesla T4 - SR-IOV capable, dynamically managed
alias = {"device_type": "type-PF", "name": "t4", "product_id": "1eb8", "vendor_id": "10de"}

# Whitelist both devices by their current addresses
passthrough_whitelist = [{"address": "0000:05:00.0"}, {"address": "0000:d8:00.0"}]